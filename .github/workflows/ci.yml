name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Emulator-only project ID. A `demo-` prefix makes the Firebase tooling refuse to
  # talk to any real backend, which is the safety net for CI.
  FIREBASE_PROJECT: demo-deside

jobs:
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      - name: Install (reproducible)
        run: npm run install:all

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json
      - run: npm run install:all
      - run: npm run test:unit

  emulator:
    name: Rules and function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      # The Firestore and Auth emulators run on the JVM and require JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm run install:all
      - run: npm install -g firebase-tools@15

      - name: Security rules tests
        run: firebase emulators:exec --only firestore --project $FIREBASE_PROJECT "npx vitest run --config vitest.rules.config.ts"

      - name: Cloud Function tests
        run: |
          npm run build:functions
          GCLOUD_PROJECT=$FIREBASE_PROJECT firebase emulators:exec --only auth,firestore,functions --project $FIREBASE_PROJECT "npx vitest run --config vitest.functions.config.ts"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json
      - run: npm run install:all
      - name: Build app and functions
        env:
          # Build-time placeholders. The real web config is injected at deploy time;
          # it is public configuration, not a secret, but it is still per-environment.
          VITE_USE_EMULATORS: 'true'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          retention-days: 7

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm run install:all
      - run: npm install -g firebase-tools@15
      - run: npm run build:functions
      - run: npx playwright install --with-deps chromium

      - name: Playwright (against the emulators)
        env:
          CI: 'true'
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
